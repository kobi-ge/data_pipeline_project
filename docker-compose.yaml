services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: pass  # אותה סיסמה שהגדרת בקוד
      MYSQL_DATABASE: sql_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 5

  server-c:
    build: 
      context: .  
      dockerfile: server-c/Dockerfile
    container_name: server-c-container
    ports:
      - "8002:8000"
    environment:
      DATABASE_HOST: mysql_db
      DATABASE_USER: root
      DATABASE_PASSWORD: pass
      DATABASE_NAME: sql_db
      DATABASE_PORT: 3306
      TABLE_NAME: records_table
    depends_on:
      mysql_db:
        condition: service_healthy

  server-b:
    build: 
      context: . 
      dockerfile: server-b/Dockerfile
    container_name: server-b-container
    ports:
      - "8001:8000"
    environment:
      - SERVER_C_NAME=server-c
      - SERVER_C_PORT=8000
      - SERVER_C_TIMEOUT=5

  server-a:
    build:
      context: .
      dockerfile: server-a/Dockerfile
    container_name: server-a-container
    ports:
      - "8000:8000"
    environment:
     - SERVER_B_NAME=server-b
     - SERVER_B_PORT=8000
     - SERVER_B_TIMEOUT=5 